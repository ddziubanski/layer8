name: Installer validation
on:
  pull_request:
    paths:
      - 'install/**'
      - 'iso/**'
      - 'dev/iso-test.sh'
      - '.github/workflows/installer-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oauth-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OAuth callback headers and log redaction through Nginx
        run: sh install/tests/check-oauth-proxy.sh
  wizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for file in install/wizard.sh install/files/layer8-console iso/*.sh dev/iso-test.sh; do sh -n "$file"; done
      - name: Exercise wizard flows without provisioning
        run: python3 -m unittest discover -s install/tests -v
      - name: Check boot media contracts
        run: python3 -m unittest discover -s iso/tests -v
      - name: Render real terminal dialogs at 80x24
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y whiptail python3-pexpect python3-pyte python3-pil fonts-dejavu-core
          python3 iso/tests/dialog_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer8-setup-previews
          path: iso/build/previews/*.png
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install VM preview tools
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-x86 ovmf python3-pil
      - name: Build offline appliance ISO
        run: sh iso/build.sh
      - name: Boot both firmware menus without a disk
        run: python3 iso/tests/boot_smoke.py "$(find iso/build -maxdepth 1 -name 'layer8-*.iso' -print -quit)" iso/build/previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer8-iso-preview
          path: |
            iso/build/layer8-*.iso
            iso/build/previews/*.png
          retention-days: 7
