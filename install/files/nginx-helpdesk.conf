# Layer 8: HTTPS on 443, port 80 only redirects. Written by install/install.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name @HOST@;

    ssl_certificate     /etc/helpdesk/tls/cert.pem;
    ssl_certificate_key /etc/helpdesk/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only the root-owned updater can create this marker. Keep users away from
    # a schema/code switch and from a failed or interrupted recovery.
    set $layer8_maintenance 0;
    if (-f /var/lib/layer8-updater/maintenance) { set $layer8_maintenance 1; }

    # Random capability URL from the admin's update request. Only sanitized,
    # root-written progress, readable even while the application is stopped.
    location ~ "^/api/update-progress/([0-9a-f]{32})\.json$" {
        alias /var/lib/layer8-updater/progress/$1.json;
        default_type application/json;
        autoindex off;
        access_log off;
        error_log /dev/null crit;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Restart recovery is static and remains available while the API is stopped.
    error_page 502 503 504 /__layer8_maintenance.html;
    location = /__layer8_maintenance.html {
        internal;
        alias /usr/local/lib/layer8-updater/maintenance.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Attachments: the app enforces Settings > General's limit; this only has to be above it.
    client_max_body_size 1024m;
    proxy_read_timeout 300s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # OAuth query parameters contain one-use authorization codes. Do not log
    # callback URLs at this proxy (the application also redacts Uvicorn logs).
    location = /api/meraki/oauth/callback {
        if ($layer8_maintenance = 1) { return 503; }
        access_log off;
        error_log /dev/null crit;
        # Location add_header directives replace the server's inherited list.
        # Preserve its protections while preventing callback codes in referrers.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        if ($layer8_maintenance = 1) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
