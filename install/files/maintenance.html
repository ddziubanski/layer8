<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Layer 8 — reconnecting</title>
<style>body{margin:0;background:#07131f;color:#edf4fa;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{max-width:600px;margin:24px;padding:36px;border:1px solid #294653;border-radius:16px;background:#102331}h1{font-size:28px;line-height:1.3}strong{color:#32d4c8;letter-spacing:.12em}p{color:#c0d0df}button{border:1px solid #32d4c8;border-radius:8px;background:#153c49;color:#fff;font:inherit;padding:10px 18px;cursor:pointer}button:disabled{opacity:.6}</style>
<main class="card"><strong>LAYER 8</strong><h1>Reconnecting to your service desk</h1><p>Services are temporarily unavailable. An update or restart may be in progress. This page will reconnect automatically when the API is ready.</p><p id="status" role="status" aria-live="polite">Checking the connection…</p><button id="retry" type="button">Check again now</button><noscript><p>Automatic recovery needs JavaScript. Refresh this page after services return.</p></noscript></main>
<script>
(() => {
  let timer, checking = false, attempts = 0;
  const button = document.getElementById('retry'), status = document.getElementById('status');
  async function check() {
    if (checking) return;
    clearTimeout(timer); checking = true; button.disabled = true;
    const controller = new AbortController(), deadline = setTimeout(() => controller.abort(), 8000);
    try {
      const options = {cache:'no-store',credentials:'same-origin',signal:controller.signal};
      const response = await fetch('/api/health', options);
      if (!response.ok || (await response.json()).status !== 'ok') throw new Error('Not ready');
      const about = await fetch('/api/about', options);
      const data = about.ok ? await about.json() : null;
      if (!data || typeof data.version !== 'string' || !data.version.trim()) throw new Error('Not ready');
      status.textContent = 'Services are ready. Opening Layer 8…';
      window.location.reload();
      return;
    } catch (_) {
      attempts++;
      status.textContent = attempts < 12 ? 'Still reconnecting. You do not need to refresh.' : 'Still waiting for services. If this continues, ask an administrator to review the update or local recovery. No update will be retried by this page.';
      timer = setTimeout(check, 5000);
    } finally { clearTimeout(deadline); checking = false; button.disabled = false; }
  }
  button.addEventListener('click', check);
  check();
})();
</script></html>
