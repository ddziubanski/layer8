set default=choose
set timeout=-1
set menu_color_normal=light-gray/blue
set menu_color_highlight=black/cyan
if loadfont /boot/grub/font.pf2; then
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=1024x768,auto
    terminal_output gfxterm
    set theme=/boot/grub/layer8/theme.txt
fi

menuentry "Install Layer 8 - choose disk and partitioning" --id choose {
    linux /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/preseed-partitioned.cfg vga=788 --- quiet console=tty0
    initrd /install.amd/initrd.gz
}
menuentry "Install Layer 8 - ERASE entire first disk" --id erase {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 --- quiet console=tty0
    initrd /install.amd/initrd.gz
}
