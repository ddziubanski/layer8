ui vesamenu.c32
default choose
prompt 0
timeout 0
menu resolution 1024 768
menu background /boot/grub/layer8/background.png
menu title Layer 8 | Appliance setup
menu width 80
menu margin 4
menu rows 4
menu vshift 20
menu helpmsgrow 29
menu cmdlinerow 34
menu tabmsgrow 33
menu endrow 36
menu color border 0 #00000000 #00000000 none
menu color title 0 #fff2f6fa #0012243a none
menu color unsel 0 #fff2f6fa #0012243a none
menu color sel 0 #ff12243a #ff32d4c8 none
menu color help 0 #ffccd8e5 #0012243a none
menu color tabmsg 0 #ffccd8e5 #0012243a none
label choose
    menu label Install Layer 8 - choose disk and partitioning
    menu default
    kernel /install.amd/vmlinuz
    append initrd=/install.amd/initrd.gz auto=true priority=high preseed/file=/cdrom/preseed-partitioned.cfg vga=788 --- quiet console=tty0
    text help
Choose guided or manual partitioning, then review disk changes.
    endtext
label erase
    menu label Install Layer 8 - ERASE entire first disk
    kernel /install.amd/vmlinuz
    append initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 --- quiet console=tty0
    text help
DESTRUCTIVE: replaces partitions and data on the first disk.
Use only for a disposable VM or a dedicated appliance disk.
    endtext
