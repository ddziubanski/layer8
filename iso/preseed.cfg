# Layer 8 appliance: Debian 13 from this ISO alone (no network needed).
# This file is the explicit ERASE option. prepare-media.py removes partitioning and
# bootloader answers for the default interactive option. Both retain first-boot setup.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string helpdesk
d-i netcfg/get_domain string
d-i netcfg/hostname string helpdesk
d-i hw-detect/load_firmware boolean true

# Everything from the ISO: no network mirror (works offline; the bundle carries the rest).
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# An OS admin for maintenance (ssh / console), created locked: no password exists until the setup
# wizard (or the answers file's install.os_password) sets one, so nobody can log in first.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Appliance administrator
d-i passwd/username string sdadmin
d-i passwd/user-password-crypted password !

# Explicit whole-disk option only: LVM, one partition. All data is replaced.
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# The service desk bundle, and its setup on first boot.
d-i preseed/late_command string \
  mkdir -p /target/opt/helpdesk-setup ; \
  cp -a /cdrom/helpdesk/. /target/opt/helpdesk-setup/ ; \
  cp /cdrom/helpdesk/bundle/install/files/helpdesk-firstboot.service /target/etc/systemd/system/ ; \
  in-target systemctl enable helpdesk-firstboot.service

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
